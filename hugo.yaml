              I also developed dbt Core ELT workflows for a data warehouse, with daily GitHub Actions CI/CD, and an Airbyte integration collecting data from multiple sources into PostgreSQL. I presented how to integrate OpenTelemetry, Prometheus, and Grafana with Java Spring Boot applications and network nodes, while owning architecture, delivery, deployment, and production support.
