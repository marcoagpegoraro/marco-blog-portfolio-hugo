  about:
    enable: true
    title: "About Me"
    image: "/images/marco-eiffel-tower.webp"
    content: |-
      I'm Marco, a software engineer with eight years of experience delivering software across e-commerce, banking, logistics, and consulting. Java is my core expertise, and I also work with Kotlin, Python, JavaScript, Angular, React, C#, Go, and AWS. I hold two AWS certifications, an Azure certification, CKAD, and an MBA in Solution Architecture.

      My experience spans Java and Kotlin back ends with Spring Boot and Kafka; AWS and Terraform; data platforms with Glue, Athena, and QuickSight; and front ends with Angular, React, and Next.js. I enjoy learning new technologies—including practical AI, observability, and cloud-native tooling—and finding the most effective solution to each problem.

      Outside work, I’m into cars, music, watches, and vintage 90s/00s computers and video games—especially the history behind how technology evolved.
    skills:
      enable: true
      title: "Technologies I’ve worked with:"
      items: ["Java", "Kotlin", "Spring Boot", "Apache Kafka", "OpenFeign", "AWS", "DynamoDB", "SNS & SQS", "Terraform", "GitHub Actions", "Python", "JavaScript", "TypeScript", "Angular", "React", "Next.js", "Go", "Fiber", "GORM", "Django", "Vue 3", "dbt", "Airbyte", "PostgreSQL", "OpenTelemetry", "Prometheus", "Grafana", "AWS Glue", "Athena", "QuickSight"]

